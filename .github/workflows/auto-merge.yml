# turns on auto-merge for every PR, it still waits for 1 approval before merging
name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# the bot needs these to turn on auto-merge
permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    # skip draft PRs
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Turn on auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}